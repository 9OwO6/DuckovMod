name = BetterThrowingSystem
displayName = 更好的投掷物系统
description = 按G键切换并掏出投掷物，支持投掷动作与装备切换。按G键可以循环切换背包中的所有投掷物（手雷、炸弹、闪光弹等），并自动装备到手上。长按G键打开轮盘菜单，使用鼠标滚轮切换投掷物。投掷完成后自动切回武器。v2.3.1更新：✨ 投掷物识别列表支持实时刷新并自动保存。✨ 新增自动识别系统，会根据物品属性/组件动态加入新的投掷物。✨ 温雷升级：闪光手雷、管状炸弹等落地即爆，自动处理延迟引信。🔧 优化ModSetting加载、碰撞检测与日志诊断，减少兼容问题。

