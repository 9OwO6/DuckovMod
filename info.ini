name = BetterThrowingSystem
displayName = 更好的投掷物系统
description = 按G键切换并掏出投掷物，支持投掷动作与装备切换。按G键可以循环切换背包中的所有投掷物（手雷、炸弹、闪光弹等），并自动装备到手上。长按G键打开轮盘菜单，使用鼠标滚轮切换投掷物。投掷完成后自动切回武器。v2.1.9新增：集成ModSetting设置菜单，支持在游戏内设置界面配置投掷音效、按G键模式、视角模式等选项。新增"正常视角"选项。v2.1.8优化：增强投掷物识别白名单，排除所有图腾、衣服、针剂药品等非投掷物，修复图腾抗电3、橡胶工作服等误识别问题。

